spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/taskmanager}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:serg6363}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB
  mail:
    # SMTP для писем восстановления пароля. Если MAIL_HOST пуст, письма не отправляются.
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
          ssl:
            enable: ${MAIL_SMTP_SSL:false}

server:
  port: ${SERVER_PORT:8080}
  # Учитывать X-Forwarded-* заголовки, когда приложение стоит за nginx
  forward-headers-strategy: framework

app:
  cors:
    # Через запятую. На сервере укажите публичный адрес приложения, например:
    # CORS_ORIGINS=https://tasks.example.com
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}
  jwt:
    secret: ${JWT_SECRET:super-secret-key-for-jwt-token-generation-must-be-long-enough-1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  upload-dir: ${UPLOAD_DIR:uploads}
  # Регулярная очистка неиспользуемых файлов в upload-dir.
  media-cleanup:
    enabled: ${MEDIA_CLEANUP_ENABLED:true}
    # По умолчанию — ежедневно в 03:00 по времени сервера (6 полей: сек мин час день месяц день_недели).
    cron: "${MEDIA_CLEANUP_CRON:0 0 3 * * *}"
    # Файлы, загруженные менее N минут назад, не удаляются: форма могла ещё не сохраниться.
    min-age-minutes: ${MEDIA_CLEANUP_MIN_AGE_MINUTES:1440}
  # Восстановление пароля по email.
  password-reset:
    # Время жизни одноразовой ссылки.
    token-ttl-minutes: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:60}
    # Публичный адрес приложения — из него строится ссылка в письме.
    # Если APP_BASE_URL не задан, берём CORS_ORIGINS (обычно это тот же адрес).
    base-url: ${APP_BASE_URL:${CORS_ORIGINS:http://localhost:5173}}
    # Адрес отправителя (должен быть разрешён SMTP-провайдером).
    from: ${MAIL_FROM:no-reply@localhost}
    rate-limit:
      # Не более N запросов за окно (отдельно по IP и по email).
      max-requests: ${PASSWORD_RESET_RATE_LIMIT_MAX:5}
      window-minutes: ${PASSWORD_RESET_RATE_LIMIT_WINDOW_MINUTES:15}

