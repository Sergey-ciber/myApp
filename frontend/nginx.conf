# Переключение протокола для WebSocket/SockJS (нужно для /ws/)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Если перед контейнером стоит TLS-прокси на хосте (Caddy), он присылает
# X-Forwarded-Proto: https. Передаём значение бэкенду как есть, иначе Spring
# считает HTTPS-запросы http (redirect-ы и абсолютные ссылки).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Загрузка медиафайлов: должен быть не меньше spring.servlet.multipart.max-request-size
    # (100 МБ на файл + запас на multipart-обёртку).
    client_max_body_size 110m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Статика сборки Vite — имена файлов содержат хеш, можно кешировать надолго
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API проксируется на backend: браузер видит один origin, CORS не нужен
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # WebSocket/SockJS (STOMP-каналы приглашений и командной игры).
    # Без этого блока /ws/ отдавался SPA-фолбэком (index.html) и realtime не работал.
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        # SockJS xhr-streaming и websocket — долгоживущие соединения:
        # не буферизуем и не рвём их по таймауту.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA: любой неизвестный путь отдаёт index.html (клиентский роутинг React Router)
    location / {
        # Токен сброса пароля приходит в query string — не отдаём URL как Referer наружу.
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }
}
