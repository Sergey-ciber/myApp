server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Загрузка аватара: должен быть не меньше spring.servlet.multipart.max-request-size
    client_max_body_size 6m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Статика сборки Vite — имена файлов содержат хеш, можно кешировать надолго
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API проксируется на backend: браузер видит один origin, CORS не нужен
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # SPA: любой неизвестный путь отдаёт index.html (клиентский роутинг React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
