# Production-развёртывание: PostgreSQL + backend + frontend (nginx).
# Запуск:  docker compose -f docker-compose.prod.yml up -d --build
# Значения берутся из файла .env (см. .env.example)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskmanager}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-taskmanager}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-taskmanager}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
      JWT_SECRET: ${JWT_SECRET:?Задайте JWT_SECRET в .env}
      # Публичный адрес приложения (Origin запросов из браузера).
      # Без него POST/PUT/PATCH будут отклоняться с 403.
      CORS_ORIGINS: ${CORS_ORIGINS:?Задайте CORS_ORIGINS в .env}
      # Публичный адрес для ссылки в письме. Пусто — берётся первый адрес из CORS_ORIGINS.
      APP_BASE_URL: ${APP_BASE_URL:-}
      UPLOAD_DIR: /app/uploads
      # SMTP для писем восстановления пароля. Пустой MAIL_HOST отключает отправку.
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@localhost}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      MAIL_SMTP_SSL: ${MAIL_SMTP_SSL:-false}
      PASSWORD_RESET_TOKEN_TTL_MINUTES: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:-60}
      PASSWORD_RESET_RATE_LIMIT_MAX: ${PASSWORD_RESET_RATE_LIMIT_MAX:-5}
      PASSWORD_RESET_RATE_LIMIT_WINDOW_MINUTES: ${PASSWORD_RESET_RATE_LIMIT_WINDOW_MINUTES:-15}
      # Супер-администратор: создаётся при старте, если его ещё нет.
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-superadmin}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-serg6363}
    volumes:
      - uploads:/app/uploads
    expose:
      - "8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  pgdata:
  uploads:
